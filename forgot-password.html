<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — Job Univers</title>
<style>
  :root{
    --navy:#0F1B2D; --navy-light:#16273E; --cream:#F7F5F1; --gold:#E8A33D; --teal:#2E7D6B;
    --ink:#1A1F26; --ink-soft:#5B6470; --line:#E4E1D9; --white:#FFFFFF; --danger:#C4432E; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased;}
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .topbar{background:var(--navy); color:var(--white); padding:18px 24px; display:flex; align-items:center; justify-content:center;}
  .brand{display:flex; align-items:center; gap:10px; font-size:1.05rem; font-weight:700;}
  .brand-mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--gold), var(--teal)); display:flex; align-items:center; justify-content:center; font-family:'Sora', sans-serif; font-weight:800; color:var(--navy); font-size:0.85rem;}
  .wrap{max-width:420px; margin:0 auto; padding:40px 20px;}
  h1.title{font-size:1.5rem; font-weight:800; margin-bottom:8px;}
  p.subtitle{color:var(--ink-soft); font-size:0.9rem; margin-bottom:24px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:24px 20px;}
  .field-group{margin-bottom:16px;}
  label{display:block; font-size:0.78rem; font-weight:600; margin-bottom:7px;}
  .field{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;}
  .field:focus-within{border-color:var(--navy);}
  .field input{border:none; outline:none; font-family:'Inter'; font-size:0.94rem; width:100%; background:transparent; color:var(--ink);}
  .btn-primary{width:100%; background:var(--navy); color:var(--white); border:none; border-radius:10px; padding:14px; font-family:'Sora'; font-weight:700; font-size:0.95rem; cursor:pointer;}
  .btn-primary:disabled{opacity:0.6;}
  .msg{font-size:0.84rem; padding:12px 14px; border-radius:8px; margin-bottom:16px; text-align:center;}
  .msg.success{background:#E4F3E9; color:#22823F;}
  .msg.error{background:#FBEAE7; color:var(--danger);}
  .back-link{display:block; text-align:center; margin-top:18px; font-size:0.84rem; color:var(--navy); font-weight:600;}
</style>
</head>
<body>

<div class="topbar"><div class="brand"><span class="brand-mark">JU</span>Job Univers</div></div>

<div class="wrap">
  <h1 class="title">Mot de passe oublié</h1>
  <p class="subtitle">Entrez votre e-mail, nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>

  <div class="card">
    <div id="msg-box"></div>
    <form id="forgot-form">
      <div class="field-group">
        <label for="email">Adresse e-mail</label>
        <div class="field"><input type="email" id="email" placeholder="vous@exemple.com" required></div>
      </div>
      <button type="submit" class="btn-primary" id="send-btn">Envoyer le lien de réinitialisation</button>
    </form>
  </div>

  <a href="login.html" class="back-link">← Retour à la connexion</a>
</div>

<script>
  const API_BASE = "http://localhost:3003";
  const form = document.getElementById('forgot-form');
  const msgBox = document.getElementById('msg-box');
  const sendBtn = document.getElementById('send-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.innerHTML = '';
    const email = document.getElementById('email').value.trim();

    sendBtn.disabled = true;
    sendBtn.textContent = "Envoi en cours...";

    try {
      await fetch(`${API_BASE}/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      msgBox.innerHTML = '<div class="msg success">✅ Si un compte existe avec cet e-mail, un lien de réinitialisation vient d\'être envoyé.</div>';
      form.reset();
    } catch (err) {
      msgBox.innerHTML = '<div class="msg error">Impossible de contacter le serveur. Vérifiez qu\'il est bien lancé.</div>';
    }

    sendBtn.disabled = false;
    sendBtn.textContent = "Envoyer le lien de réinitialisation";
  });
</script>

</body>
</html>
