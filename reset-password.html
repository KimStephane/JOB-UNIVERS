<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Job Univers</title>
<style>
  :root{
    --navy:#0F1B2D; --navy-light:#16273E; --cream:#F7F5F1; --gold:#E8A33D; --teal:#2E7D6B;
    --ink:#1A1F26; --ink-soft:#5B6470; --line:#E4E1D9; --white:#FFFFFF; --danger:#C4432E; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased;}
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .topbar{background:var(--navy); color:var(--white); padding:18px 24px; display:flex; align-items:center; justify-content:center;}
  .brand{display:flex; align-items:center; gap:10px; font-size:1.05rem; font-weight:700;}
  .brand-mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--gold), var(--teal)); display:flex; align-items:center; justify-content:center; font-family:'Sora', sans-serif; font-weight:800; color:var(--navy); font-size:0.85rem;}
  .wrap{max-width:420px; margin:0 auto; padding:40px 20px;}
  h1.title{font-size:1.5rem; font-weight:800; margin-bottom:8px;}
  p.subtitle{color:var(--ink-soft); font-size:0.9rem; margin-bottom:24px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:24px 20px;}
  .field-group{margin-bottom:16px;}
  label{display:block; font-size:0.78rem; font-weight:600; margin-bottom:7px;}
  .field{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;}
  .field:focus-within{border-color:var(--navy);}
  .field input{border:none; outline:none; font-family:'Inter'; font-size:0.94rem; width:100%; background:transparent; color:var(--ink);}
  .field button{background:none; border:none; cursor:pointer; font-size:1rem; opacity:0.5; flex-shrink:0;}
  .btn-primary{width:100%; background:var(--navy); color:var(--white); border:none; border-radius:10px; padding:14px; font-family:'Sora'; font-weight:700; font-size:0.95rem; cursor:pointer;}
  .btn-primary:disabled{opacity:0.6;}
  .msg{font-size:0.84rem; padding:12px 14px; border-radius:8px; margin-bottom:16px; text-align:center;}
  .msg.success{background:#E4F3E9; color:#22823F;}
  .msg.error{background:#FBEAE7; color:var(--danger);}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="topbar"><div class="brand"><span class="brand-mark">JU</span>Job Univers</div></div>

<div class="wrap">
  <h1 class="title">Nouveau mot de passe</h1>
  <p class="subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

  <div class="card">
    <div id="msg-box"></div>

    <form id="reset-form">
      <div class="field-group">
        <label for="password">Nouveau mot de passe</label>
        <div class="field">
          <input type="password" id="password" placeholder="8 caractères minimum" minlength="8" required>
          <button type="button" id="toggle-password">👁️</button>
        </div>
      </div>
      <div class="field-group">
        <label for="password2">Confirmer le mot de passe</label>
        <div class="field">
          <input type="password" id="password2" placeholder="Retapez le mot de passe" minlength="8" required>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="reset-btn">Réinitialiser le mot de passe</button>
    </form>

    <div id="invalid-link" hidden>
      <div class="msg error">⚠️ Ce lien est invalide ou a expiré.</div>
      <a href="forgot-password.html" style="display:block; text-align:center; font-size:0.86rem; font-weight:600; color:var(--navy);">Faire une nouvelle demande →</a>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:3003";
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  const form = document.getElementById('reset-form');
  const msgBox = document.getElementById('msg-box');
  const resetBtn = document.getElementById('reset-btn');

  if (!token) {
    form.hidden = true;
    document.getElementById('invalid-link').hidden = false;
  }

  document.getElementById('toggle-password').addEventListener('click', function () {
    const input = document.getElementById('password');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.textContent = isHidden ? '🙈' : '👁️';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.innerHTML = '';

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      msgBox.innerHTML = '<div class="msg error">Les deux mots de passe ne correspondent pas.</div>';
      return;
    }
    if (password.length < 8) {
      msgBox.innerHTML = '<div class="msg error">Le mot de passe doit contenir au moins 8 caractères.</div>';
      return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = "Réinitialisation...";

    try {
      const res = await fetch(`${API_BASE}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password })
      });
      const data = await res.json();

      if (data.success) {
        msgBox.innerHTML = '<div class="msg success">✅ Mot de passe réinitialisé ! Redirection vers la connexion...</div>';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        msgBox.innerHTML = `<div class="msg error">${data.error || "Échec de la réinitialisation."}</div>`;
      }
    } catch (err) {
      msgBox.innerHTML = '<div class="msg error">Impossible de contacter le serveur.</div>';
    }

    resetBtn.disabled = false;
    resetBtn.textContent = "Réinitialiser le mot de passe";
  });
</script>

</body>
</html>
